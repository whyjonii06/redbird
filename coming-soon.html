<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redbird — Coming soon</title>
  <link rel="icon" href="/redbird.svg" type="image/svg+xml" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0a0a0a; color: #e5e7eb; text-align: center; padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    img { width: 120px; height: auto; filter: drop-shadow(0 0 40px rgba(232,48,42,0.25)); }
    h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; letter-spacing: -0.03em; margin: 28px 0 8px; }
    p { color: #9ca3af; font-size: 15px; margin: 0; }
    .dot { color: #e8302a; }
  </style>
</head>
<body>
  <img src="/redbird.svg" alt="Redbird" />
  <h1>Redbird<span class="dot">.</span></h1>
  <p>Coming soon.</p>

</html>
