# Fly.io deploy config for the Redbird API
# Deploy: fly launch --dockerfile packages/api/Dockerfile (from repo root)
# Docs:   https://fly.io/docs/reference/configuration/

app = "redbird-api"
primary_region = "cdg"   # Paris — change to your closest region

[build]
  dockerfile = "packages/api/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  # Persist redbird.meta.json and uploaded images across deploys
  source = "redbird_data"
  destination = "/app/data"
