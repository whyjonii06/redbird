name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint runs in parallel with the main CI job (fast, independent)
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck core → api → plugin-sdk → cli in workspace dependency order.
      # Tests use PGlite (in-memory Postgres) — no external DB service needed.
      - name: Typecheck packages
        run: pnpm build

      - name: Test (184 specs, PGlite)
        run: pnpm test

      # Build apps after packages to catch any cross-package type regressions
      - name: Build storefront
        run: pnpm --filter @redbird/storefront build

      - name: Build backoffice
        run: pnpm --filter @redbird/backoffice build
